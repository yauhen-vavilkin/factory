<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Factory — Executions</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 70rem; color: #1a1a1a; }
        nav a { margin-right: 1rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid #ddd; }
        .status-COMPLETED { color: #1e7e34; font-weight: 600; }
        .status-FAILED_ESCALATED, .status-REJECTED, .status-CANCELLED { color: #b3261e; font-weight: 600; }
        .status-AWAITING_HITL { color: #b26a00; font-weight: 600; }
    </style>
</head>
<body>
<nav><a href="/reviews">Reviews</a> <a href="/executions"><strong>Executions</strong></a> <a href="/jira">Run Jira Task</a> <a href="/api/status">Status</a></nav>
<h1>Pipeline executions</h1>
<table>
    <tr><th>Execution</th><th>Flow</th><th>Status</th><th>Step</th><th>Created</th><th>Updated</th></tr>
    <tr th:each="e : ${executions}">
        <td><a th:href="@{'/executions/' + ${e.id}}" th:text="${#strings.abbreviate(e.id.toString(), 13)}"></a></td>
        <td th:text="${e.flowId}"></td>
        <td th:class="'status-' + ${e.status}" th:text="${e.status}"></td>
        <td th:text="${e.currentStepIndex}"></td>
        <td th:text="${e.createdAt}"></td>
        <td th:text="${e.updatedAt}"></td>
    </tr>
</table>
</body>
</html>
