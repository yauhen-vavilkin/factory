<!DOCTYPE html>
<html th:replace="~{fragments/layout :: page(title='Audit', activeNav='audit', content=~{:: .page-body}, scripts=~{})}"
      xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<section class="page-body">
    <div class="page-header">
        <h1>Audit</h1>
        <p class="page-description">Append-only record of every step, artifact write, and decision.</p>
    </div>

    <form class="filter-bar" method="get" th:action="@{/audit}">
        <input type="hidden" name="executionId" th:if="${!#strings.isEmpty(selectedExecutionId)}"
               th:value="${selectedExecutionId}">
        <div class="filter-field">
            <label class="label" for="filter-event-type">Event type</label>
            <select class="select" id="filter-event-type" name="eventType">
                <option value="" th:selected="${selectedEventType == ''}">All</option>
                <option th:each="t : ${eventTypes}" th:value="${t['value']}" th:text="${t['label']}"
                        th:selected="${t['value'] == selectedEventType}"></option>
            </select>
        </div>
        <button class="btn btn-outline" type="submit">Apply</button>
        <a class="btn btn-ghost" href="/audit" th:if="${!#strings.isEmpty(selectedExecutionId)}">Clear execution filter</a>
    </form>

    <p class="page-description" th:if="${!#strings.isEmpty(selectedExecutionId)}"
       th:text="'Showing only execution ' + ${selectedExecutionId}"></p>

    <div th:if="${#lists.isEmpty(events)}" class="empty-state">No audit events match this filter.</div>
    <div th:unless="${#lists.isEmpty(events)}">
        <div th:replace="~{fragments/components :: auditTable(${events}, true)}"></div>
        <nav th:replace="~{fragments/components :: slicePagination(${page}, ${baseUrl})}"></nav>
    </div>
</section>
</body>
</html>
