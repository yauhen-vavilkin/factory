<!DOCTYPE html>
<html th:replace="~{fragments/layout :: page(title='Reviews', activeNav='reviews', content=~{:: .page-body}, scripts=~{})}"
      xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<section class="page-body">
    <div class="page-header">
        <h1>Reviews</h1>
        <p class="page-description">Human-in-the-loop gates and their decisions.</p>
    </div>

    <nav class="tabs" aria-label="Review status">
        <a th:each="tab : ${statusTabs}" th:href="@{/reviews(status=${tab})}"
           th:text="${#strings.capitalize(tab.toLowerCase())}"
           th:attrappend="aria-current=${tab == selectedStatus} ? 'page'">PENDING</a>
    </nav>

    <div class="table-wrap" th:unless="${#lists.isEmpty(reviews)}">
        <table>
            <thead>
            <tr>
                <th>Title</th><th>Flow</th><th>Gate</th>
                <th th:if="${showDecision}">Status</th>
                <th>Created</th>
                <th th:if="${showDecision}">Decided</th>
                <th th:if="${showDecision}">Decision</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${reviews}">
                <td th:text="${r['title']}"></td>
                <td th:text="${r['flowId']}"></td>
                <td th:text="${r['gateId']}"></td>
                <td th:if="${showDecision}">
                    <span th:replace="~{fragments/components :: statusBadge(${r['status']})}"></span>
                </td>
                <td class="muted" th:text="${r['createdAt']}"></td>
                <td class="muted" th:if="${showDecision}" th:text="${r['decidedAt']} ?: '—'"></td>
                <td th:if="${showDecision}">
                    <span th:if="${r['decision']}" th:text="${r['decision']}"></span>
                    <span th:unless="${r['decision']}" class="muted">—</span>
                    <span class="muted" th:if="${r['reviewer']}" th:text="' · ' + ${r['reviewer']}"></span>
                </td>
                <td>
                    <a class="btn btn-outline btn-sm" th:href="@{'/reviews/' + ${r['id']}}">Review</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:replace="~{fragments/components :: pagination(${page}, ${baseUrl})}"></nav>

    <div class="empty-state" th:if="${#lists.isEmpty(reviews)}">Nothing to show for this status.</div>
</section>
</body>
</html>
