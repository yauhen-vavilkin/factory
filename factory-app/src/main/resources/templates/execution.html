<!DOCTYPE html>
<html th:replace="~{fragments/layout :: page(title='Execution', activeNav='executions', content=~{:: .page-body}, scripts=~{})}"
      xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<section class="page-body">
    <div class="page-header">
        <h1 th:text="'Execution ' + ${#strings.abbreviate(execution.id.toString(), 13)}">Execution</h1>
        <div class="page-header-meta">
            <span th:text="${execution.flowId + ' v' + execution.flowVersion}">flow</span>
            <span th:replace="~{fragments/components :: statusBadge(${execution.status})}"></span>
            <span>· step <span th:text="${execution.currentStepIndex}"></span></span>
            <span th:if="${execution.parentExecutionId}">
                · parent
                <a th:href="@{'/executions/' + ${execution.parentExecutionId}}"
                   th:text="${#strings.abbreviate(execution.parentExecutionId.toString(), 13)}"></a>
            </span>
        </div>
    </div>

    <div class="alert alert-error" role="alert" th:if="${execution.errorMessage}">
        <span th:text="'Last error: ' + ${execution.errorMessage}"></span>
    </div>

    <div class="stack">
        <section>
            <div class="page-header">
                <h2 class="card-title">Artifacts</h2>
            </div>
            <div class="empty-state" th:if="${#lists.isEmpty(artifacts)}">No artifacts produced.</div>
            <div class="card" th:each="a : ${artifacts}">
                <div class="card-header">
                    <h3 class="card-title" th:text="${a.name + ' (v' + a.version + ')'}"></h3>
                    <p class="card-description"
                       th:text="'by ' + ${a.createdBy} + ' · ' + ${a.createdAt}"></p>
                </div>
                <div class="card-content">
                    <details class="details-inline">
                        <summary>View content</summary>
                        <pre class="code-block" th:text="${a.content}"></pre>
                    </details>
                </div>
            </div>
        </section>

        <section>
            <div class="page-header">
                <h2 class="card-title">Audit timeline</h2>
            </div>
            <div th:replace="~{fragments/components :: auditTable(${events})}"></div>
        </section>
    </div>
</section>
</body>
</html>
