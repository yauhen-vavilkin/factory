<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Factory — Execution</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 70rem; color: #1a1a1a; }
        nav a { margin-right: 1rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #ddd; vertical-align: top; }
        details { margin: .75rem 0; }
        pre { background: #f4f6f8; padding: .75rem; overflow-x: auto; font-size: .8rem; }
        code.detail { font-size: .78rem; color: #444; }
    </style>
</head>
<body>
<nav><a href="/reviews">Reviews</a> <a href="/executions">Executions</a></nav>
<h1>Execution <span th:text="${#strings.abbreviate(execution.id.toString(), 13)}"></span></h1>
<p>Flow <code th:text="${execution.flowId + ' v' + execution.flowVersion}"></code>
    · status <strong th:text="${execution.status}"></strong>
    · step <span th:text="${execution.currentStepIndex}"></span>
    <span th:if="${execution.parentExecutionId}">
        · parent <a th:href="@{'/executions/' + ${execution.parentExecutionId}}"
                    th:text="${#strings.abbreviate(execution.parentExecutionId.toString(), 13)}"></a></span></p>
<p th:if="${execution.errorMessage}" style="color:#b3261e"
   th:text="'Last error: ' + ${execution.errorMessage}"></p>

<h2>Artifacts</h2>
<details th:each="a : ${artifacts}">
    <summary><strong th:text="${a.name}"></strong>
        v<span th:text="${a.version}"></span> — by <span th:text="${a.createdBy}"></span>
        at <span th:text="${a.createdAt}"></span></summary>
    <pre th:text="${a.content}"></pre>
</details>

<h2>Audit timeline</h2>
<table>
    <tr><th>When</th><th>Event</th><th>Step</th><th>Actor</th><th>Detail</th></tr>
    <tr th:each="ev : ${events}">
        <td th:text="${ev.occurredAt}"></td>
        <td th:text="${ev.eventType}"></td>
        <td th:text="${ev.stepId}"></td>
        <td th:text="${ev.actor}"></td>
        <td><code class="detail" th:text="${ev.detail}"></code></td>
    </tr>
</table>
</body>
</html>
