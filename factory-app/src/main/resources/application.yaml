      base-url: ${FACTORY_TEST_FACTORY_EXECUTION_BASE_URL:}
      karate-jar: ${FACTORY_TEST_FACTORY_EXECUTION_KARATE_JAR:}
    target-repo: ${FACTORY_TEST_FACTORY_TARGET_REPO:}
    base-branch: ${FACTORY_TEST_FACTORY_BASE_BRANCH:main}
    jira-transition: ${FACTORY_TEST_FACTORY_JIRA_TRANSITION:}
    # Explicit placeholders: relaxed binding would NOT map the underscored env
    # vars onto these kebab-case properties by itself.
    testrail-section-id: ${FACTORY_TEST_FACTORY_TESTRAIL_SECTION_ID:}

logging:
  # OBS-1: JSON logging is opt-in via env so local `mvn spring-boot:run` stays
  # human-readable. Set FACTORY_LOG_FORMAT=ecs (or logstash / gelf) in containers.
  # An empty value keeps the standard pattern; under ecs/logstash every MDC entry
  # (executionId, stepId) is auto-included in the JSON.
  structured:
    format:
      console: ${FACTORY_LOG_FORMAT:}
    ecs:
      service:
        name: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        # OBS-1: prometheus scrape at /actuator/prometheus, metrics browse at /actuator/metrics.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # OBS-1: registers /actuator/health/liveness and /actuator/health/readiness probes.
      probes:
        enabled: true
      # Security-adjacent: exposes db + connector details to unauthenticated callers.
      # Acceptable for Milestone 1; tighten to when-authorized once the endpoint is
      # secured (out of scope here).
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
