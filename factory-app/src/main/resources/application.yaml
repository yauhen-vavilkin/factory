spring:
  application:
    name: ai-factory
  datasource:
    url: ${FACTORY_DB_URL:jdbc:postgresql://127.0.0.1:55432/factory}
    username: ${FACTORY_DB_USER:factory}
    password: ${FACTORY_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${FACTORY_LLM_BASE_URL:https://api.z.ai/api/anthropic}
      chat:
        options:
          model: ${FACTORY_LLM_MODEL:claude-sonnet-4-5}
          max-tokens: 8192

factory:
  mode: ${FACTORY_MODE:live}
  engine:
    poll-interval-ms: 2000
    max-concurrent-executions: 1
    batch-size: 1
    worker-threads: 1
    # 45 min: strictly above the 30-min harness job timeout + clone/teardown
    # margin, so the reaper never re-queues a live coding step (T14 R7).
    lease-timeout-seconds: 2700
  connectors:
    external-writes-enabled: ${FACTORY_EXTERNAL_WRITES_ENABLED:true}
    jira:
      base-url: ${FACTORY_CONNECTORS_JIRA_BASE_URL:}
      email: ${FACTORY_CONNECTORS_JIRA_EMAIL:}
      api-token: ${FACTORY_CONNECTORS_JIRA_API_TOKEN:}
    github:
      base-url: ${FACTORY_CONNECTORS_GITHUB_BASE_URL:}
      token: ${FACTORY_CONNECTORS_GITHUB_TOKEN:}
    testrail:
      base-url: ${FACTORY_CONNECTORS_TESTRAIL_BASE_URL:}
      username: ${FACTORY_CONNECTORS_TESTRAIL_USERNAME:}
      api-key: ${FACTORY_CONNECTORS_TESTRAIL_API_KEY:}
      project-id: ${FACTORY_CONNECTORS_TESTRAIL_PROJECT_ID:0}
  flowa:
    execution:
      base-url: ${FACTORY_FLOWA_EXECUTION_BASE_URL:}
      karate-jar: ${FACTORY_FLOWA_EXECUTION_KARATE_JAR:}
    target-repo: ${FACTORY_FLOWA_TARGET_REPO:}
    base-branch: ${FACTORY_FLOWA_BASE_BRANCH:main}
    jira-transition: ${FACTORY_FLOWA_JIRA_TRANSITION:}
    # Explicit placeholders: relaxed binding would NOT map the underscored env
    # vars onto these kebab-case properties by itself.
    testrail-section-id: ${FACTORY_FLOWA_TESTRAIL_SECTION_ID:}
  harness:
    max-steps: 40
    max-format-errors: 3
    job-timeout-min: 30
    model-id: ${FACTORY_HARNESS_MODEL:glm-5.3-flash}
  sandbox:
    mode: ${FACTORY_SANDBOX_MODE:docker}
    image: ${FACTORY_SANDBOX_IMAGE:factory-pi:jdk21}
    docker-host: ${DOCKER_HOST:unix:///var/run/docker.sock}
    workspace-root: ${FACTORY_DATA_DIR:.factory/data}/sandboxes
    workspace-retention: 0s
    maven-repository: ${FACTORY_SANDBOX_MAVEN_REPOSITORY:.factory/cache/maven-repository}
    docker-network: ${FACTORY_SANDBOX_DOCKER_NETWORK:factory-pi-network}
    dependency-docker-network: ${FACTORY_SANDBOX_DEPENDENCY_DOCKER_NETWORK:factory-pi-dependency-network}
  pi:
    model-token: ${FACTORY_MODEL_TOKEN:}
    gateway-url: ${FACTORY_PI_GATEWAY_URL:http://factory-gateway:8080/v1}
    thinking: ${FACTORY_MODEL_THINKING:high}
  inbox:
    dir: ${FACTORY_INBOX_DIR:.factory/data/inbox}
    enabled: ${FACTORY_INBOX_ENABLED:true}
    poll-interval-ms: ${FACTORY_INBOX_POLL_INTERVAL_MS:5000}
    event-type: ${FACTORY_INBOX_EVENT_TYPE:file.inbox}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  address: ${FACTORY_SERVER_ADDRESS:127.0.0.1}
  port: ${FACTORY_APP_PORT:18080}

---
spring:
  config:
    activate:
      on-profile: pi
  ai:
    model:
      chat: none

factory:
  mode: pi
  connectors:
    external-writes-enabled: false
  sandbox:
    mode: docker
  pi:
    gateway-url: ${FACTORY_PI_GATEWAY_URL:http://host.docker.internal:18081/v1}

---
spring:
  config:
    activate:
      on-profile: offline
  ai:
    model:
      chat: none

factory:
  mode: offline
  connectors:
    external-writes-enabled: false
  sandbox:
    mode: docker
  dev:
    recovery-root: ${FACTORY_DATA_DIR:.factory/data}/recovery

---
spring:
  config:
    activate:
      on-profile: live

factory:
  mode: live
  connectors:
    external-writes-enabled: false
  sandbox:
    mode: docker
  dev:
    recovery-root: ${FACTORY_DATA_DIR:.factory/data}/recovery
