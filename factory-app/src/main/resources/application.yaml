          repository: yauhen-vavilkin/mod-roles-keycloak
          base-branch: master
          authorized: true
        mgr-tenant-entitlements:
          repository: yauhen-vavilkin/mgr-tenant-entitlements
          base-branch: master
          authorized: true
  test-factory:
