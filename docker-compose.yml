services:
  factory-gateway:
    build:
      context: ./factory-gateway
    # Run the gateway process as the invoking host user so the bind-mounted
    # evidence directory stays writable (the image default uid 10001 cannot
    # write a 0700 host-owned directory and evidence recording would silently
    # fail — found during the M4 live qualification).
    user: "${FACTORY_GATEWAY_UID:-1000}:${FACTORY_GATEWAY_GID:-1000}"
    environment:
      FACTORY_GATEWAY_MODE: coding
      FACTORY_UPSTREAM_BASE_URL: ${FACTORY_MODEL_BASE_URL:-https://api.z.ai/api/paas/v4}
      FACTORY_UPSTREAM_API_KEY: ${FACTORY_MODEL_API_KEY:-}
      FACTORY_EXPECTED_MODEL: ${FACTORY_MODEL_ID:-glm-5.3-flash}
      FACTORY_RUN_TOKEN: ${FACTORY_MODEL_TOKEN:-}
      FACTORY_GATEWAY_EXPIRES_AT: ${FACTORY_GATEWAY_EXPIRES_AT:-0}
      FACTORY_MAX_ATTEMPTS: ${FACTORY_MODEL_MAX_ATTEMPTS:-40}
      FACTORY_MAX_OUTPUT_TOKENS: ${FACTORY_MODEL_MAX_OUTPUT_TOKENS:-16384}
    ports:
      - "127.0.0.1:${FACTORY_GATEWAY_PORT:-18081}:8080"
    volumes:
      - ./.factory/logs/runs:/evidence
    networks: [factory-pi-network, factory-pi-egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    restart: unless-stopped
  factory-dependency-gateway:
    build:
      context: ./factory-gateway
    user: "${FACTORY_GATEWAY_UID:-1000}:${FACTORY_GATEWAY_GID:-1000}"
    environment:
      FACTORY_GATEWAY_MODE: dependencies
    volumes:
      - ./.factory/logs/runs:/evidence
    networks:
      factory-pi-dependency-network:
        aliases: [factory-gateway]
      factory-pi-egress: {}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    restart: unless-stopped
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: factory
      POSTGRES_USER: factory
      POSTGRES_PASSWORD_FILE: /run/secrets/factory_postgres_password
    ports:
      - "127.0.0.1:${FACTORY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./.factory/data/postgres:/var/lib/postgresql/data
    secrets:
      - factory_postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

networks:
  factory-pi-network:
    name: ${FACTORY_SANDBOX_DOCKER_NETWORK:-factory-pi-network}
    internal: true
  factory-pi-dependency-network:
    name: ${FACTORY_SANDBOX_DEPENDENCY_DOCKER_NETWORK:-factory-pi-dependency-network}
    internal: true
  factory-pi-egress:
    name: ${FACTORY_GATEWAY_EGRESS_NETWORK:-factory-pi-egress}

secrets:
  factory_postgres_password:
    file: ./.factory/secrets/postgres-password
