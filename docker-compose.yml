services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: factory
      POSTGRES_USER: factory
      POSTGRES_PASSWORD_FILE: /run/secrets/factory_postgres_password
    ports:
      - "127.0.0.1:${FACTORY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./.factory/data/postgres:/var/lib/postgresql/data
    secrets:
      - factory_postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

secrets:
  factory_postgres_password:
    file: ./.factory/secrets/postgres-password
