include:
  - compose.runtime-${FACTORY_DEV_FACTORY_CODING_RUNTIME:-claude-code}.yml

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: factory
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
    ports:
      - "${FACTORY_BIND_ADDRESS:-127.0.0.1}:${FACTORY_DB_PORT:-5432}:5432"
    volumes:
      - factory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 3s
      retries: 10

  factory:
    build: .
    image: ${FACTORY_APP_IMAGE:-folio-factory-app:local}
    # Docker Desktop exposes the daemon socket to root in this single-user MVP.
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
      coding-runtime:
        condition: service_completed_successfully
    environment:
      FACTORY_DB_URL: jdbc:postgresql://postgres:5432/factory
      FACTORY_DB_USER: factory
      FACTORY_DB_PASSWORD: factory
      # The app listens on the container interface; the published host port below
      # remains loopback-only by default.
      FACTORY_SERVER_ADDRESS: 0.0.0.0
      # Pass through all documented application settings. An unset null value is
      # omitted from the container, retaining Spring's own defaults (including
      # the different Anthropic/OpenAI FACTORY_LLM_MODEL defaults).
      ANTHROPIC_API_KEY:
      FACTORY_LLM_PROVIDER:
      FACTORY_LLM_MODEL:
      FACTORY_LLM_API_KEY:
      FACTORY_LLM_BASE_URL:
      FACTORY_LLM_COMPLETIONS_PATH:
      FACTORY_DB_POOL_MAX:
      FACTORY_DB_POOL_MIN_IDLE:
      FACTORY_DB_POOL_CONNECTION_TIMEOUT_MS:
      FACTORY_DB_POOL_MAX_LIFETIME_MS:
      FACTORY_DB_POOL_IDLE_TIMEOUT_MS:
      FACTORY_DB_POOL_LEAK_DETECTION_MS:
      FACTORY_WEBHOOKS_SHARED_SECRET:
      FACTORY_HTTP_CONNECT_TIMEOUT:
      FACTORY_HTTP_READ_TIMEOUT:
      FACTORY_CONNECTORS_JIRA_BASE_URL: ${FACTORY_CONNECTORS_JIRA_BASE_URL:-}
      FACTORY_CONNECTORS_JIRA_EMAIL: ${FACTORY_CONNECTORS_JIRA_EMAIL:-}
      FACTORY_CONNECTORS_JIRA_API_TOKEN: ${FACTORY_CONNECTORS_JIRA_API_TOKEN:-}
      FACTORY_CONNECTORS_GITHUB_TOKEN: ${FACTORY_CONNECTORS_GITHUB_TOKEN:-}
      FACTORY_CONNECTORS_GITHUB_BASE_URL: ${FACTORY_CONNECTORS_GITHUB_BASE_URL:-}
      FACTORY_CONNECTORS_TESTRAIL_BASE_URL:
      FACTORY_CONNECTORS_TESTRAIL_USERNAME:
      FACTORY_CONNECTORS_TESTRAIL_API_KEY:
      FACTORY_CONNECTORS_TESTRAIL_PROJECT_ID:
      FACTORY_TEST_FACTORY_TARGET_REPO:
      FACTORY_TEST_FACTORY_BASE_BRANCH:
      FACTORY_TEST_FACTORY_TESTRAIL_SECTION_ID:
      FACTORY_TEST_FACTORY_JIRA_TRANSITION:
      FACTORY_TEST_FACTORY_EXECUTION_BASE_URL:
      FACTORY_TEST_FACTORY_EXECUTION_KARATE_JAR:
      FACTORY_DEV_FACTORY_GIT_BASE_URL: ${FACTORY_DEV_FACTORY_GIT_BASE_URL:-https://github.com}
      # The catalog owns repository defaults. Only explicit operator overrides
      # are forwarded; Compose must not replace a custom catalog's fallbacks.
      FACTORY_SIDECAR_SOURCE_REPO:
      FACTORY_SIDECAR_DELIVERY_REPO:
      FACTORY_SIDECAR_BASE_BRANCH:
      FACTORY_SIDECAR_DELIVERY_AUTHORIZED:
      FACTORY_MOD_ROLES_KEYCLOAK_SOURCE_REPO:
      FACTORY_MOD_ROLES_KEYCLOAK_DELIVERY_REPO:
      FACTORY_MOD_ROLES_KEYCLOAK_BASE_BRANCH:
      FACTORY_MOD_ROLES_KEYCLOAK_DELIVERY_AUTHORIZED:
      FACTORY_MGR_TENANT_ENTITLEMENTS_SOURCE_REPO:
      FACTORY_MGR_TENANT_ENTITLEMENTS_DELIVERY_REPO:
      FACTORY_MGR_TENANT_ENTITLEMENTS_BASE_BRANCH:
      FACTORY_MGR_TENANT_ENTITLEMENTS_DELIVERY_AUTHORIZED:
      FACTORY_MGR_APPLICATIONS_SOURCE_REPO:
      FACTORY_MGR_APPLICATIONS_DELIVERY_REPO:
      FACTORY_MGR_APPLICATIONS_BASE_BRANCH:
      FACTORY_MGR_APPLICATIONS_DELIVERY_AUTHORIZED:
      FACTORY_MODEL_API_KEY: ${FACTORY_MODEL_API_KEY:-}
      FACTORY_MODEL_BASE_URL: ${FACTORY_MODEL_BASE_URL:-}
      FACTORY_MODEL_PROVIDER: ${FACTORY_MODEL_PROVIDER:-}
      FACTORY_MODEL_ID: ${FACTORY_MODEL_ID:-}
      FACTORY_MODEL_API: ${FACTORY_MODEL_API:-openai-completions}
      FACTORY_MODEL_REASONING_EFFORT: ${FACTORY_MODEL_REASONING_EFFORT:-}
      FACTORY_MODEL_MAX_OUTPUT_TOKENS: ${FACTORY_MODEL_MAX_OUTPUT_TOKENS:-16384}
      FACTORY_PI_IMAGE: ${FACTORY_PI_IMAGE:-}
      FACTORY_PI_PROVIDER: ${FACTORY_PI_PROVIDER:-}
      FACTORY_PI_MODEL: ${FACTORY_PI_MODEL:-}
      FACTORY_PI_BASE_URL: ${FACTORY_PI_BASE_URL:-}
      FACTORY_PI_API: ${FACTORY_PI_API:-}
      FACTORY_PI_AUTHENTICATION: ${FACTORY_PI_AUTHENTICATION:-api-key}
      FACTORY_PI_API_KEY: ${FACTORY_PI_API_KEY:-}
      FACTORY_PI_REASONING_EFFORT: ${FACTORY_PI_REASONING_EFFORT:-}
      FACTORY_PI_MAX_OUTPUT_TOKENS: ${FACTORY_PI_MAX_OUTPUT_TOKENS:-}
      FACTORY_CLAUDE_CODE_IMAGE: ${FACTORY_CLAUDE_CODE_IMAGE:-factory-dev-claude-code:2.1.287-java21}
      FACTORY_CLAUDE_CODE_API: ${FACTORY_CLAUDE_CODE_API:-anthropic-messages}
      FACTORY_CLAUDE_CODE_BASE_URL: ${FACTORY_CLAUDE_CODE_BASE_URL:-http://host.docker.internal:4001}
      FACTORY_CLAUDE_CODE_MODEL: ${FACTORY_CLAUDE_CODE_MODEL:-claude-sonnet-5-5}
      FACTORY_CLAUDE_CODE_AUTHENTICATION: ${FACTORY_CLAUDE_CODE_AUTHENTICATION:-bearer-token}
      FACTORY_CLAUDE_CODE_API_KEY: ${FACTORY_CLAUDE_CODE_API_KEY:-}
      FACTORY_CLAUDE_CODE_AUTH_TOKEN: ${FACTORY_CLAUDE_CODE_AUTH_TOKEN:-codemie-proxy}
      FACTORY_CLAUDE_CODE_MAX_TURNS: ${FACTORY_CLAUDE_CODE_MAX_TURNS:-40}
      FACTORY_CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${FACTORY_CLAUDE_CODE_MAX_OUTPUT_TOKENS:-16384}
      FACTORY_CLAUDE_CODE_EFFORT: ${FACTORY_CLAUDE_CODE_EFFORT:-}
      FACTORY_DEV_FACTORY_CODING_IMAGE: ${FACTORY_DEV_FACTORY_CODING_IMAGE:-factory-dev-pi:0.85.1-java21}
      FACTORY_DEV_FACTORY_CODING_RUNTIME: ${FACTORY_DEV_FACTORY_CODING_RUNTIME:-claude-code}
      FACTORY_DEV_FACTORY_TIMEOUT_SECONDS: ${FACTORY_DEV_FACTORY_TIMEOUT_SECONDS:-1800}
      FACTORY_DEV_FACTORY_MAVEN_CACHE_VOLUME: ${FACTORY_DEV_FACTORY_MAVEN_CACHE_VOLUME:-factory-dev-m2-cache}
      FACTORY_ENGINE_LEASE_TIMEOUT_SECONDS: ${FACTORY_ENGINE_LEASE_TIMEOUT_SECONDS:-7200}
      FACTORY_ENGINE_POLL_INTERVAL_MS:
      FACTORY_ENGINE_BATCH_SIZE:
      FACTORY_ENGINE_WORKER_THREADS:
      FACTORY_ENGINE_REAP_INTERVAL_MS:
      FACTORY_ENGINE_SHUTDOWN_AWAIT_SECONDS:
      FACTORY_ENGINE_RECLAIM_RUNNING_ON_STARTUP:
      FACTORY_SHUTDOWN_PHASE_TIMEOUT:
      FACTORY_LIMITS_MAX_CONCURRENT_EXECUTIONS:
      FACTORY_LIMITS_MAX_EXECUTIONS_PER_DAY:
      FACTORY_LIMITS_MAX_ARTIFACT_BYTES:
      FACTORY_LIMITS_MAX_TRIGGER_PAYLOAD_BYTES:
      FACTORY_LIMITS_DEDUP_ENABLED:
      FACTORY_LIMITS_DEDUP_WINDOW:
      FACTORY_LIMITS_DEDUP_ID_POINTERS:
      FACTORY_RETENTION_ENABLED:
      FACTORY_RETENTION_TTL_DAYS:
      FACTORY_RETENTION_BATCH_SIZE:
      FACTORY_RETENTION_RUN_CRON:
      FACTORY_LOG_FORMAT:
      SPRING_CONFIG_IMPORT: classpath:developer-repositories.yaml,file:/application/config/developer-repositories.yaml,optional:file:/application/config/developer-pricing.yaml
    ports:
      - "${FACTORY_BIND_ADDRESS:-127.0.0.1}:${FACTORY_APP_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - factory-dev-m2-cache:/var/lib/factory-dev-m2-cache:ro
      - ./config/developer-pricing.yaml:/application/config/developer-pricing.yaml:ro
      - ${FACTORY_DEV_FACTORY_REPOSITORIES_FILE:-./config/developer-repositories.yaml}:/application/config/developer-repositories.yaml:ro

volumes:
  factory-pgdata:
  factory-dev-m2-cache:
    name: ${FACTORY_DEV_FACTORY_MAVEN_CACHE_VOLUME:-factory-dev-m2-cache}
