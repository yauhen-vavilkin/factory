# Opt-in software-composition-analysis (DEP-1). Deliberately NOT run on every push/PR:
# the OWASP NVD feed download is slow and network-bound. Runs weekly + on demand.
# ci.yml owns the primary build/test workflow; this workflow is standalone.
name: dependency-check

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owasp:
    name: OWASP Dependency-Check (aggregate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Persist the NVD H2 database between runs so scans don't re-download it.
      # Keyed per-run; restore-keys fall back to the most recent prior cache.
      - name: Cache OWASP NVD data
        uses: actions/cache@v4
        with:
          path: .dependency-check-data
          key: owasp-nvd-${{ github.run_id }}
          restore-keys: |
            owasp-nvd-

      # No Maven wrapper in this repo — use the runner's Maven (matches ci.yml).
      # NVD_API_KEY is optional but strongly recommended: without it the NVD update
      # is heavily rate-limited (20+ min). Add it as a repo secret. Tests are skipped
      # (they need Docker/Testcontainers and are irrelevant to dependency scanning).
      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B -ntp -Powasp -DskipTests
          -Dnvd.api.key="${NVD_API_KEY}"
          verify

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: warn
