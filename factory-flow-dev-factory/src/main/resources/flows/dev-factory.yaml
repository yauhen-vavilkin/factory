id: dev-factory
name: Developer Flow
version: 0.6.0
triggers:
  - event_type: manual
input_schema:
  required: [issueKey]
output_schema:
  artifacts: [dev_candidate.json, dev_readiness.json, dev_verification.json, dev_delivery.json, dev_result.json]
retry_policy:
  max_attempts: 3
  backoff_seconds: [30, 120, 300]
agent_chain:
  - step_id: read-task
    type: AGENT
    worker_id: dev-intake
    inputs: ["$trigger"]
    outputs: [dev_intake.md, dev_decision_request.md, dev_decision_answer.md]

  - step_id: select-repository
    type: AGENT
    worker_id: dev-decision-gate
    inputs: [dev_decision_request.md]
    outputs: []

  - step_id: prepare-task
    type: AGENT
    worker_id: dev-intake-resolve
    inputs: [dev_intake.md, dev_decision_request.md, dev_decision_answer.md]
    outputs: [dev_task_brief.md]

  - step_id: implement
    type: AGENT
    worker_id: dev-develop
    inputs: [dev_task_brief.md]
    outputs: [dev_candidate.json, dev_readiness.json]

  - step_id: verify
    type: AGENT
    worker_id: dev-verify
    inputs: [dev_candidate.json]
    outputs: [dev_verification.json, dev_result.json]

  - step_id: publish
    type: AGENT
    worker_id: dev-deliver
    inputs: [dev_task_brief.md, dev_candidate.json, dev_verification.json, dev_result.json]
    outputs: [dev_delivery.json, dev_result.json]
