# Operator-owned repository catalog. Add repositories here without rebuilding Factory.
# Each entry owns its source, Jira routing, verification policy and delivery destination.
# Delivery inherits the entry's base-branch and requires explicit authorization.
factory:
  dev-factory:
    repositories:
      sidecar:
        source-repo: ${FACTORY_SIDECAR_SOURCE_REPO:folio-org/folio-module-sidecar}
        base-branch: ${FACTORY_SIDECAR_BASE_BRANCH:master}
        build-image: maven:3.9-eclipse-temurin-21
        verification-plan: java21-unit
        jira-projects: [MODSIDECAR]
        delivery:
          repository: ${FACTORY_SIDECAR_DELIVERY_REPO:folio-org/folio-module-sidecar}
          authorized: ${FACTORY_SIDECAR_DELIVERY_AUTHORIZED:false}
      mod-roles-keycloak:
        source-repo: ${FACTORY_MOD_ROLES_KEYCLOAK_SOURCE_REPO:folio-org/mod-roles-keycloak}
        base-branch: ${FACTORY_MOD_ROLES_KEYCLOAK_BASE_BRANCH:master}
        build-image: maven:3.9-eclipse-temurin-21
        verification-plan: java21-roles-verify
        jira-projects: [MODROLESKC]
        delivery:
          repository: ${FACTORY_MOD_ROLES_KEYCLOAK_DELIVERY_REPO:folio-org/mod-roles-keycloak}
          authorized: ${FACTORY_MOD_ROLES_KEYCLOAK_DELIVERY_AUTHORIZED:false}
      mgr-tenant-entitlements:
        source-repo: ${FACTORY_MGR_TENANT_ENTITLEMENTS_SOURCE_REPO:folio-org/mgr-tenant-entitlements}
        base-branch: ${FACTORY_MGR_TENANT_ENTITLEMENTS_BASE_BRANCH:master}
        build-image: maven:3.9-eclipse-temurin-21
        verification-plan: java21-unit
        jira-projects: [MGRENTITLE]
        delivery:
          repository: ${FACTORY_MGR_TENANT_ENTITLEMENTS_DELIVERY_REPO:folio-org/mgr-tenant-entitlements}
          authorized: ${FACTORY_MGR_TENANT_ENTITLEMENTS_DELIVERY_AUTHORIZED:false}
      mgr-applications:
        source-repo: ${FACTORY_MGR_APPLICATIONS_SOURCE_REPO:folio-org/mgr-applications}
        base-branch: ${FACTORY_MGR_APPLICATIONS_BASE_BRANCH:master}
        build-image: maven:3.9-eclipse-temurin-21
        verification-plan: java21-unit
        jira-projects: [MGRAPPS]
        delivery:
          repository: ${FACTORY_MGR_APPLICATIONS_DELIVERY_REPO:folio-org/mgr-applications}
          authorized: ${FACTORY_MGR_APPLICATIONS_DELIVERY_AUTHORIZED:false}
    runtime:
      plans:
        java21-unit: [mvn, -B, -ntp, test]
        java21-roles-verify: [mvn, -B, -ntp, verify]
      # Require fresh, executed reports from each Maven test phase.
      # Integration plans remain blocked when their Docker dependencies are unavailable.
      required-reports:
        java21-unit: [surefire]
        java21-roles-verify: [surefire, failsafe]
