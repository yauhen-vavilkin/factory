# Operator-owned repository catalog. Add repositories here without rebuilding Factory.
# Each entry owns its source, Jira routing, verification policy and delivery destination.
# Delivery inherits the entry's base-branch. The delivery repository decides where the pull
# request goes: the official folio-org repository by default, or your fork when you set
# both <REPO>_SOURCE_REPO and <REPO>_DELIVERY_REPO (for example FACTORY_SIDECAR_SOURCE_REPO
# and FACTORY_SIDECAR_DELIVERY_REPO).
factory:
  dev-factory:
    repositories:
      sidecar:
        source-repo: ${FACTORY_SIDECAR_SOURCE_REPO:folio-org/folio-module-sidecar}
        base-branch: ${FACTORY_SIDECAR_BASE_BRANCH:master}
        build-image: maven:3.9-eclipse-temurin-21
        verification-plan: java21-unit
        jira-projects: [MODSIDECAR]
        delivery:
          repository: ${FACTORY_SIDECAR_DELIVERY_REPO:folio-org/folio-module-sidecar}
      mod-roles-keycloak:
        source-repo: ${FACTORY_MOD_ROLES_KEYCLOAK_SOURCE_REPO:folio-org/mod-roles-keycloak}
        base-branch: ${FACTORY_MOD_ROLES_KEYCLOAK_BASE_BRANCH:master}
        build-image: maven:3.9-eclipse-temurin-21
        verification-plan: java21-unit
        jira-projects: [MODROLESKC]
        delivery:
          repository: ${FACTORY_MOD_ROLES_KEYCLOAK_DELIVERY_REPO:folio-org/mod-roles-keycloak}
      mgr-tenant-entitlements:
        source-repo: ${FACTORY_MGR_TENANT_ENTITLEMENTS_SOURCE_REPO:folio-org/mgr-tenant-entitlements}
        base-branch: ${FACTORY_MGR_TENANT_ENTITLEMENTS_BASE_BRANCH:master}
        build-image: maven:3.9-eclipse-temurin-21
        verification-plan: java21-unit
        jira-projects: [MGRENTITLE]
        delivery:
          repository: ${FACTORY_MGR_TENANT_ENTITLEMENTS_DELIVERY_REPO:folio-org/mgr-tenant-entitlements}
      mgr-applications:
        source-repo: ${FACTORY_MGR_APPLICATIONS_SOURCE_REPO:folio-org/mgr-applications}
        base-branch: ${FACTORY_MGR_APPLICATIONS_BASE_BRANCH:master}
        build-image: maven:3.9-eclipse-temurin-21
        verification-plan: java21-unit
        jira-projects: [MGRAPPS]
        delivery:
          repository: ${FACTORY_MGR_APPLICATIONS_DELIVERY_REPO:folio-org/mgr-applications}
      ui-users:
        source-repo: ${FACTORY_UI_USERS_SOURCE_REPO:folio-org/ui-users}
        base-branch: ${FACTORY_UI_USERS_BASE_BRANCH:master}
        build-image: node:22.22.0-bookworm
        verification-plan: node22-jest
        jira-projects: [UIU]
        delivery:
          repository: ${FACTORY_UI_USERS_DELIVERY_REPO:folio-org/ui-users}
      ui-circulation:
        source-repo: ${FACTORY_UI_CIRCULATION_SOURCE_REPO:folio-org/ui-circulation}
        base-branch: ${FACTORY_UI_CIRCULATION_BASE_BRANCH:master}
        build-image: node:22.22.0-bookworm
        verification-plan: node22-jest
        jira-projects: [UICIRC]
        delivery:
          repository: ${FACTORY_UI_CIRCULATION_DELIVERY_REPO:folio-org/ui-circulation}
      ui-inventory:
        source-repo: ${FACTORY_UI_INVENTORY_SOURCE_REPO:folio-org/ui-inventory}
        base-branch: ${FACTORY_UI_INVENTORY_BASE_BRANCH:master}
        build-image: node:22.22.0-bookworm
        verification-plan: node22-jest
        jira-projects: [UIIN]
        delivery:
          repository: ${FACTORY_UI_INVENTORY_DELIVERY_REPO:folio-org/ui-inventory}
      ui-marc-authorities:
        source-repo: ${FACTORY_UI_MARC_AUTHORITIES_SOURCE_REPO:folio-org/ui-marc-authorities}
        base-branch: ${FACTORY_UI_MARC_AUTHORITIES_BASE_BRANCH:master}
        build-image: node:22.22.0-bookworm
        verification-plan: node22-jest
        jira-projects: [UIMARCAUTH]
        delivery:
          repository: ${FACTORY_UI_MARC_AUTHORITIES_DELIVERY_REPO:folio-org/ui-marc-authorities}
      ui-checkin:
        source-repo: ${FACTORY_UI_CHECKIN_SOURCE_REPO:folio-org/ui-checkin}
        base-branch: ${FACTORY_UI_CHECKIN_BASE_BRANCH:master}
        build-image: node:22.22.0-bookworm
        verification-plan: node22-jest
        jira-projects: [UICHKIN]
        delivery:
          repository: ${FACTORY_UI_CHECKIN_DELIVERY_REPO:folio-org/ui-checkin}
      ui-eholdings:
        source-repo: ${FACTORY_UI_EHOLDINGS_SOURCE_REPO:folio-org/ui-eholdings}
        base-branch: ${FACTORY_UI_EHOLDINGS_BASE_BRANCH:master}
        build-image: node:22.22.0-bookworm
        verification-plan: node22-jest
        jira-projects: [UIEH]
        delivery:
          repository: ${FACTORY_UI_EHOLDINGS_DELIVERY_REPO:folio-org/ui-eholdings}
      ui-myprofile:
        source-repo: ${FACTORY_UI_MYPROFILE_SOURCE_REPO:folio-org/ui-myprofile}
        base-branch: ${FACTORY_UI_MYPROFILE_BASE_BRANCH:master}
        build-image: node:22.22.0-bookworm
        verification-plan: node22-jest
        jira-projects: [UIMPROF]
        delivery:
          repository: ${FACTORY_UI_MYPROFILE_DELIVERY_REPO:folio-org/ui-myprofile}
      ui-tags:
        source-repo: ${FACTORY_UI_TAGS_SOURCE_REPO:folio-org/ui-tags}
        base-branch: ${FACTORY_UI_TAGS_BASE_BRANCH:master}
        build-image: node:22.22.0-bookworm
        verification-plan: node22-jest
        jira-projects: [UITAG]
        delivery:
          repository: ${FACTORY_UI_TAGS_DELIVERY_REPO:folio-org/ui-tags}
    runtime:
      plans:
        java21-unit: [mvn, -B, -ntp, test]
        java21-roles-verify: [mvn, -B, -ntp, verify]
        # --maxWorkers keeps Jest inside the Podman VM's memory (see doc/dev-flow-ui-support.md).
        node22-jest: [yarn, test, --maxWorkers=2]
      # Plans that are not Maven: the toolchain sets the dependency cache, install and test evidence.
      plan-toolchains:
        node22-jest: yarn
      # Require fresh, executed reports from each Maven test phase.
      # Integration plans remain blocked when their Docker dependencies are unavailable.
      # Factory's build containers have no Docker, so Testcontainers suites (FOLIO *IT classes)
      # always fail there. No repository uses java21-roles-verify; it stays as an integration plan example.
      required-reports:
        java21-unit: [surefire]
        java21-roles-verify: [surefire, failsafe]
